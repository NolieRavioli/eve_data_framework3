Environment Variables:
  LANGUAGE: "en"
  SUPPORTED_LANGUAGES: "en"
  PUBLIC_DATA_FOLDER: "_publicData"
  EVE_PRIVATE_DATABASE_FOLDER: "_privateData/"
  SDE_PATH: "_sde/"

# Role-based access control.
# default_roles are granted to every new user on their first login
# (site owner is exempt — they have full access already).
# Role names must match the "role" field in each application's auth.json.
Auth:
  default_roles:
    - dashboard
    - queue

# SDE section toggles — set false to skip a dataset at startup.
# Disabled sections will lazy-load on first use (or return defaults if they're
# expensive enough that you never want them).
SDE:
  database_file: "_publicData/public.duckdb"
  load_types: true           # type ID <-> name maps          (~26 MB, ~4s)
  load_groups: true          # item group hierarchy            (~0.3 MB, fast)
  load_categories: true      # item categories                 (~0.1 MB, fast)
  load_market_groups: true   # market group tree               (~0.3 MB, fast)
  load_universe: true        # solar-system -> region map      (8,400+ files, ~15s)
  load_blueprints: false     # manufacturing blueprints        (~4 MB, ~8s)
  load_type_materials: false # reprocessing materials          (~2 MB, ~3s)
  load_type_dogma: false     # item dogma attributes           (~26 MB, ~60s+)

Structures:
  forbidden_cooldown_days: 21           # days to skip transiently-inaccessible structures (404/network)
  unauthorized_cooldown_days: 7         # days to skip 403-inaccessible structures during enrichment
  authorized_cooldown_seconds: 3600     # seconds to skip structures that succeed

Market:
  unauthorized_cooldown_days: 7         # days to skip structures that return 403 on the market endpoint
  forbidden_cooldown_days: 21           # days to skip structures that fail for other reasons on the market endpoint
  authorized_cooldown_seconds: 3600     # seconds to skip structures that succeed
  max_retries: 3                        # per-page fetch retry limit before skipping a structure
  rate_limit_sleep_seconds: 10          # sleep duration when ESI returns 420 (error rate limit)
