name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - '_eve_data_framework_docs/**'
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push to the wiki repo

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki_checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wiki pages
        run: python _eve_data_framework_docs/sync_wiki.py --out wiki_checkout

      - name: Push to wiki
        working-directory: wiki_checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No wiki changes to commit."
          else
            git commit -m "docs: auto-sync wiki from AGENTS.md + templates"
            git push origin master
          fi
