# Release notes categories — maps PR labels to sections in auto-generated notes.
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - "Feature"
        - "enhancement"
    - title: "🐛 Bug Fixes"
      labels:
        - "Bug"
        - "bug"
    - title: "🔧 Development Tasks"
      labels:
        - "Task"
        - "development"
    - title: "📦 Other Changes"
      labels:
        - "*"
